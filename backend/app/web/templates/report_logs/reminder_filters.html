<form method="get" action="/report-logs" class="bg-white rounded-2xl border border-gray-200 p-5 mb-6">

    <input type="hidden" name="tab" value="reminders">

    <div class="flex flex-wrap gap-4 items-end">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
            <select name="reminder_status" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
                <option value="">Todos</option>
                <option value="SENT"    {% if selected_reminder_status == 'SENT'    %}selected{% endif %}>Enviado</option>
                <option value="SKIPPED" {% if selected_reminder_status == 'SKIPPED' %}selected{% endif %}>Omitido</option>
                <option value="ERROR"   {% if selected_reminder_status == 'ERROR'   %}selected{% endif %}>Error</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Límite</label>
            <select name="limit" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200">200</option>
            </select>
        </div>

        <button type="submit" class="bg-black text-white px-4 py-2 rounded-lg text-sm">
            Filtrar
        </button>

        <a href="/report-logs?tab=reminders" class="text-sm text-gray-500 hover:text-gray-700 py-2">
            Limpiar
        </a>

    </div>

</form>
